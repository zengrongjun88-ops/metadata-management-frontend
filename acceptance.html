    // ==================== 工具函数 ====================

    const formatBytes = (bytes) => {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    };

    const getStatusColor = (status) => {
      const colorMap = {
        'PENDING': 'warning',
        'APPROVED': 'success',
        'REJECTED': 'error',
        'CANCELLED': 'default',
        'PUBLISHED': 'processing',
      };
      return colorMap[status] || 'default';
    };

    const getStatusText = (status) => {
      const textMap = {
        'PENDING': '待审批',
        'APPROVED': '已通过',
        'REJECTED': '已拒绝',
        'CANCELLED': '已取消',
        'PUBLISHED': '已发布',
      };
      return textMap[status] || status;
    };

      const colorMap = {
        'CREATE': 'success',
        'UPDATE': 'processing',
        'DELETE': 'error',
      };
      return colorMap[type] || 'default';
    };

          return;

          table.databaseName.toLowerCase().includes(value.toLowerCase()) ||

                          dataIndex: 'isPrimaryKey',
                          key: 'isPrimaryKey',
                          render: (val) => val ? <Tag color="red">是</Tag> : <Tag>否</Tag>
                        },
                        {
                          title: '加密',
                          dataIndex: 'isEncrypted',
                          key: 'isEncrypted',
                          render: (val) => val ? <Tag color="orange">是</Tag> : <Tag>否</Tag>
                        },
                        {
                          title: '敏感等级',
                          dataIndex: 'sensitivityLevel',
                          key: 'sensitivityLevel',
                          render: (text) => {
                            const colors = { L1: 'green', L2: 'blue', L3: 'orange', L4: 'red' };
                            return <Tag color={colors[text]}>{text}</Tag>;
                          }
                        },
                      ]}
                      dataSource={selectedTable.fields}
                      rowKey="fieldName"
                      pagination={false}
                      size="small"
                    />
                  </Card>
                )}
              </Space>
            )}
          </Modal>
        </>
      );
    };

    // ==================== 审批管理组件 ====================

    const ApprovalList = () => {
      const [approvals, setApprovals] = useState(mockApprovals);
      const [filteredApprovals, setFilteredApprovals] = useState(mockApprovals);
      const [approvalModalVisible, setApprovalModalVisible] = useState(false);
      const [selectedApproval, setSelectedApproval] = useState(null);
      const [form] = Form.useForm();

      const handleStatusFilter = (value) => {
        if (!value) {
          setFilteredApprovals(approvals);
          return;
        }
        const filtered = approvals.filter(item => item.status === value);
        setFilteredApprovals(filtered);
      };

      const handleApprove = (record, isApprove) => {
        setSelectedApproval(record);
        form.setFieldsValue({
          approver: 'admin',
          comment: '',
        });
        setApprovalModalVisible(true);
      };

      const handleApprovalSubmit = (values) => {
        const updatedApprovals = approvals.map(item => {
          if (item.id === selectedApproval.id) {
            return {
              ...item,
              status: 'APPROVED',
              approver: values.approver,
              approveTime: new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-'),
              approveComment: values.comment,
            };
          }
          return item;
        });
        setApprovals(updatedApprovals);
        setFilteredApprovals(updatedApprovals);
        setApprovalModalVisible(false);
        message.success('审批成功');
      };

      const handlePublish = (record) => {
        const updatedApprovals = approvals.map(item => {
          if (item.id === record.id) {
            return { ...item, status: 'PUBLISHED' };
          }
          return item;
        });
        setApprovals(updatedApprovals);
        setFilteredApprovals(updatedApprovals);
        message.success('发布成功');
      };

      const columns = [
        {
          title: '审批单号',
          dataIndex: 'flowNo',
          key: 'flowNo',
        },
        {
          title: '表名',
          dataIndex: 'tableName',
          key: 'tableName',
        },
        {
          title: '类型',
          dataIndex: 'approvalType',
          key: 'approvalType',
          render: (text) => <Tag>{text}</Tag>,
        },
        {
          title: '状态',
          dataIndex: 'status',
          key: 'status',
          render: (text) => <Tag color={getStatusColor(text)}>{getStatusText(text)}</Tag>,
        },
        {
          title: '提交人',
          dataIndex: 'submitter',
          key: 'submitter',
        },
        {
          title: '提交时间',
          dataIndex: 'submitTime',
          key: 'submitTime',
          width: 180,
        },
        {
          title: '审批人',
          dataIndex: 'approver',
          key: 'approver',
          render: (text) => text || '-',
        },
        {
          title: '审批时间',
          dataIndex: 'approveTime',
          key: 'approveTime',
          width: 180,
          render: (text) => text || '-',
        },
        {
          title: '操作',
          key: 'action',
          render: (_, record) => (
            <Space>
              {record.status === 'PENDING' && (
                <Button type="primary" size="small" onClick={() => handleApprove(record, true)}>
                  审批
                </Button>
              )}
              {record.status === 'APPROVED' && (
                <Button type="primary" size="small" onClick={() => handlePublish(record)}>
                  发布
                </Button>
              )}
            </Space>
          ),
        },
      ];

      return (
        <>
          <Space direction="vertical" style={{ width: '100%' }} size="large">
            <Space>
              <Select
                placeholder="筛选状态"
                allowClear
                style={{ width: 200 }}
                onChange={handleStatusFilter}
              >
                <Select.Option value="PENDING">待审批</Select.Option>
                <Select.Option value="APPROVED">已通过</Select.Option>
                <Select.Option value="REJECTED">已拒绝</Select.Option>
                <Select.Option value="CANCELLED">已取消</Select.Option>
                <Select.Option value="PUBLISHED">已发布</Select.Option>
              </Select>
              <Text type="secondary">共 {filteredApprovals.length} 个审批单</Text>
            </Space>

            <Table
              columns={columns}
              dataSource={filteredApprovals}
              rowKey="id"
              pagination={{ pageSize: 10 }}
            />
          </Space>

          <Modal
            title="审批"
            open={approvalModalVisible}
            onCancel={() => setApprovalModalVisible(false)}
            footer={null}
          >
            <Form form={form} onFinish={handleApprovalSubmit} layout="vertical">
              <Form.Item
                label="审批人"
                name="approver"
                rules={[{ required: true, message: '请输入审批人' }]}
              >
                <Input />
              </Form.Item>
              <Form.Item
                label="审批意见"
                name="comment"
              >
                <TextArea rows={4} placeholder="请输入审批意见" />
              </Form.Item>
              <Form.Item>
                <Space>
                  <Button type="primary" htmlType="submit">
                    通过
                  </Button>
                  <Button onClick={() => setApprovalModalVisible(false)}>
                    取消
                  </Button>
                </Space>
              </Form.Item>
            </Form>
          </Modal>
        </>
      );
    };

    // ==================== 操作历史组件 ====================

    const OperationHistory = () => {
      const [history, setHistory] = useState(mockHistory);
      const [filteredHistory, setFilteredHistory] = useState(mockHistory);

      const handleTypeFilter = (value) => {
        if (!value) {
          setFilteredHistory(history);
          return;
        }
        const filtered = history.filter(item => item.operationType === value);
        setFilteredHistory(filtered);
      };

      const columns = [
        {
          title: '操作类型',
          dataIndex: 'operationType',
          key: 'operationType',
          render: (text) => <Tag color={getOperationTypeColor(text)}>{text}</Tag>,
        },
        {
          title: '表名',
          dataIndex: 'tableName',
          key: 'tableName',
        },
        {
          title: '库名',
          dataIndex: 'databaseName',
          key: 'databaseName',
        },
        {
          title: '操作人',
          dataIndex: 'operator',
          key: 'operator',
        },
        {
          title: '操作时间',
          dataIndex: 'operationTime',
          key: 'operationTime',
          width: 180,
        },
        {
          title: '操作描述',
          dataIndex: 'operationDesc',
          key: 'operationDesc',
          ellipsis: true,
        },
      ];

      return (
        <Space direction="vertical" style={{ width: '100%' }} size="large">
          <Space>
            <Select
              placeholder="筛选操作类型"
              allowClear
              style={{ width: 200 }}
              onChange={handleTypeFilter}
            >
              <Select.Option value="CREATE">CREATE</Select.Option>
              <Select.Option value="UPDATE">UPDATE</Select.Option>
              <Select.Option value="DELETE">DELETE</Select.Option>
            </Select>
            <Text type="secondary">共 {filteredHistory.length} 条记录</Text>
          </Space>

          <Table
            columns={columns}
            dataSource={filteredHistory}
            rowKey="id"
            pagination={{ pageSize: 10 }}
          />
        </Space>
      );
    };

    // ==================== 主应用组件 ====================

    const App = () => {
      const [collapsed, setCollapsed] = useState(false);
      const [currentMenu, setCurrentMenu] = useState('1');

      const menuItems = [
        {
          key: '1',
          label: '🗄️ 元数据管理',
        },
        {
          key: '2',
          label: '✅ 审批管理',
        },
        {
          key: '3',
          label: '📜 操作历史',
        },
      ];

      const renderContent = () => {
        switch (currentMenu) {
          case '1':
            return <TableList />;
          case '2':
            return <ApprovalList />;
          case '3':
            return <OperationHistory />;
          default:
            return <TableList />;
        }
      };

      return (
        <Layout style={{ minHeight: '100vh' }}>
          <Sider trigger={null} collapsible collapsed={collapsed}>
            <div className="logo">
              <span className="logo-icon">🗄️</span>
              {!collapsed && <span>元数据管理</span>}
            </div>
            <Menu
              theme="dark"
              mode="inline"
              selectedKeys={[currentMenu]}
              items={menuItems}
              onClick={({ key }) => setCurrentMenu(key)}
            />
          </Sider>
          <Layout>
            <Header style={{ padding: 0, background: '#fff' }}>
              <div style={{ display: 'flex', alignItems: 'center', height: '100%' }}>
                <span
                  className="trigger"
                  onClick={() => setCollapsed(!collapsed)}
                  style={{ fontSize: '20px', cursor: 'pointer' }}
                >
                  {collapsed ? '☰' : '✕'}
                </span>
                <Title level={4} style={{ margin: '0 0 0 16px' }}>
                  数据仓库元数据管理系统 - 功能验收
                </Title>
              </div>
            </Header>
            <Content style={{ margin: '24px 16px 0' }}>
              <div className="site-layout-background">
                {renderContent()}
              </div>
            </Content>
          </Layout>
        </Layout>
      );
    };

    // ==================== 渲染应用 ====================

    // 使用React 18兼容的渲染方式
    const container = document.getElementById('root');
    if (window.ReactDOM.createRoot) {
      // React 18
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    } else {
      // React 17 fallback
      ReactDOM.render(<App />, container);
    }
  </script>
</body>
</html>
